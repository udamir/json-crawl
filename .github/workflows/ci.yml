name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: 2

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: dist
          path: dist

      - uses: coverallsapp/github-action@v2
        if: matrix.node == 24
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # the published bundle targets ES2020 and supports Node >= 18: load it on the oldest supported versions
  runtime:
    name: dist on Node ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Load the CommonJS and ESM builds
        run: |
          node -e 'const { syncClone, equal } = require("./dist/index.cjs"); const a = { x: [1, { y: 2 }] }; if (!equal(syncClone(a), a)) process.exit(1)'
          node --input-type=module -e 'import { syncClone, equal } from "./dist/index.mjs"; const a = { x: [1, { y: 2 }] }; if (!equal(syncClone(a), a)) process.exit(1)'
